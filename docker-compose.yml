services:
  deployer:
    image: rein_deployer
    build:
      context: ./deployer
      dockerfile: Dockerfile
    container_name: deployer
    network_mode: "host"
    stdin_open: true
    tty: true
    env_file:
      - ./deployer/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  supervisor:
    image: rein_supervisor
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: supervisor
    network_mode: "host"
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  collector:
    image: rein_collector
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: collector
    network_mode: "host"
    stdin_open: true
    tty: true
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    network_mode: "host"
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  kafka-consumer:
    image: rein_collector
    container_name: kafka-consumer
    network_mode: "host"
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python3", "-m", "collector.kafka_consumer"]

  gui:
    image: rein_gui
    build:
      context: ./collector/GUI
      dockerfile: Dockerfile
    container_name: gui
    network_mode: "host"
    environment:
      - CLICKHOUSE_URL=http://localhost:8123
      - DEPLOYER_URL=http://localhost:5000
      - GUI_PORT=8080
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8.6
    container_name: clickhouse
    network_mode: "host"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./collector/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 3s
      timeout: 2s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    network_mode: "host"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDk2OEY
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clickhouse-data: