# Brief: The vLLM models the profiler offers and where their GPU status comes from.
# llm_status_url is the llm-status service on the GPU VM (REIN/llm); while it is null,
# /models serves llm_status_stub below.
llm_status_url: null

models:
  - id: qwen3.6
    label: Qwen3.6 35B-A3B
    model: nvidia/Qwen3.6-35B-A3B-NVFP4
    base_url: http://gpu.mfcaetano.lan:8000/v1
    quantization: NVFP4
    budget_gb: 25
    pinned: true
    # Also serves the supervisor: never slept, and never sent a grammar (a Lark grammar
    # crashed its EngineCore on 2026-09-28)
    shared: true
    extra_body: {chat_template_kwargs: {enable_thinking: false}}
  - id: llama
    label: Llama 3.2 3B Instruct
    model: casperhansen/llama-3.2-3b-instruct-awq
    base_url: http://gpu.mfcaetano.lan:8001/v1
    quantization: AWQ 4-bit
    budget_gb: 4
  - id: gemma
    label: Gemma 4 12B
    model: google/gemma-4-12B-it-qat-w4a16-ct
    base_url: http://gpu.mfcaetano.lan:8002/v1
    quantization: W4A16 (QAT)
    budget_gb: 12

llm_status_stub:
  gpu: {total_gb: 32, used_gb: 25, free_gb: 7}
  models:
    qwen3.6: {state: awake, budget_gb: 25, fits: true, reason: null, kv_cache_pct: null, pinned: true}
    llama: {state: down, budget_gb: 4, fits: true, reason: "not deployed yet (REIN/llm)", kv_cache_pct: null, pinned: false}
    gemma: {state: down, budget_gb: 12, fits: false, reason: "needs 12 GB, 7 GB free next to qwen3.6", kv_cache_pct: null, pinned: false}
