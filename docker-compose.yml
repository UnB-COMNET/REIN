services:
  deployer:
    image: rein_deployer
    build:
      context: ./deployer
      dockerfile: Dockerfile
    container_name: deployer
    network_mode: "host"
    stdin_open: true
    tty: true
    env_file:
      - ./deployer/.env
    environment:
      - ONOS_KARAF=${ONOS_KARAF:-docker exec -t c1 /root/onos/apache-karaf-4.2.9/bin/client -u karaf -p karaf}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  supervisor:
    image: rein_supervisor
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: supervisor
    network_mode: "host"
    environment:
      - SUPERVISOR_MODE=${SUPERVISOR_MODE:-threshold}
      - LLM_URL=${LLM_URL:-}
      - ONOS_KARAF=${ONOS_KARAF:-docker exec -t c1 /root/onos/apache-karaf-4.2.9/bin/client -u karaf -p karaf}
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock