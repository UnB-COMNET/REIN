# Brief: The vLLM servers REIN can start, one per profile, plus llm-status. `rein up` starts the one the
# profiler picked for this machine's VRAM (models.yaml):
#   LLM_GPU_FRACTION=0.75 docker compose --profile lite up -d lite
# LLM_GPU_FRACTION is the model's budget over the GPU's memory; LLM_BIND the address the server listens
# on (127.0.0.1; 0.0.0.0 on a GPU machine that serves other machines).
# On a GPU machine apart from REIN's, llm-status tells REIN that machine's memory and models, and
# swaps them: choosing one wakes it and sleeps the others (never a pinned one):
#   LLM_BIND=0.0.0.0 docker compose --profile llama --profile status up -d
# then, on REIN's machine, set llm_status_url and the models' base_url to that machine in
# models.local.yaml, without `local`.

x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_TAG:-v0.29.0}
  network_mode: host
  ipc: host
  environment:
    - VLLM_SERVER_DEV_MODE=1          # exposes /sleep, /wake_up and /is_sleeping for llm-status
    - HF_TOKEN=${HF_TOKEN:-}
  volumes:
    - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

services:
  llama:
    <<: *vllm
    container_name: vllm-llama
    profiles: [llama]
    command: >
      --model casperhansen/llama-3.2-3b-instruct-awq --host ${LLM_BIND:-127.0.0.1} --port 8001
      --max-model-len 8192 --gpu-memory-utilization ${LLM_GPU_FRACTION:-0.125} --enable-sleep-mode

  # Ultra-lite: 1.5 GB of weights, for a 4 GB card
  lite:
    <<: *vllm
    container_name: vllm-lite
    profiles: [lite]
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct-AWQ --host ${LLM_BIND:-127.0.0.1} --port 8002
      --max-model-len 8192 --gpu-memory-utilization ${LLM_GPU_FRACTION:-0.75} --enable-sleep-mode

  llm-status:
    build: .
    container_name: llm-status
    profiles: [status]
    network_mode: host
    environment:
      - MODELS_CONFIG=/app/models.yaml
      - HOST=0.0.0.0
      - PORT=5500
    volumes:
      - ./models.yaml:/app/models.yaml:ro
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [utility]}]
