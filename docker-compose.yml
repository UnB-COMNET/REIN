services:
  deployer:
    image: rein_deployer
    build:
      context: ./deployer
      dockerfile: Dockerfile
    container_name: deployer
    network_mode: "host"
    stdin_open: true
    tty: true
    env_file:
      - ./deployer/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  supervisor:
    image: rein_supervisor
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: supervisor
    network_mode: "host"
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  collector:
    image: rein_collector
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: collector
    network_mode: "host"
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    network_mode: "host"
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    network_mode: "host"
    volumes:
      - ./collector/prometheus.yml:/etc/prometheus/prometheus.yml:ro