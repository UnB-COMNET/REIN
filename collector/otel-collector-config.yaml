receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  clickhouse:
    endpoint: tcp://127.0.0.1:9000?dial_timeout=10s
    database: otel
    username: default
    password: ""
    ttl: 168h
    async_insert: true
    logs_table_name: otel_logs
    metrics_tables:
      gauge: { name: "otel_metrics_gauge" }
      sum: { name: "otel_metrics_sum" }
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [clickhouse, debug]
    logs:
      receivers: [otlp]
      exporters: [clickhouse, debug]
