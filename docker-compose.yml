services:
  deployer:
    # nome sem prefixo "rein_": os runners do LFT sobem este container com
    # `docker run --name=deployer deployer` (por nome de imagem), não via compose
    image: deployer
    build:
      context: ./deployer
      dockerfile: Dockerfile
    container_name: deployer
    network_mode: "host"
    stdin_open: true
    tty: true
    env_file:
      - ./deployer/.env
    environment:
      - ONOS_KARAF=${ONOS_KARAF:-docker exec -t c1 /root/onos/apache-karaf-4.2.9/bin/client -u karaf -p karaf}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  supervisor:
    # mesmo motivo do deployer acima
    image: supervisor
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: supervisor
    network_mode: "host"
    environment:
      - SUPERVISOR_MODE=${SUPERVISOR_MODE:-threshold}
      - LLM_URL=${LLM_URL:-}
      - ONOS_KARAF=${ONOS_KARAF:-docker exec -t c1 /root/onos/apache-karaf-4.2.9/bin/client -u karaf -p karaf}
    stdin_open: true
    tty: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  profiler:
    image: profiler
    build:
      context: ./profiler
    container_name: profiler
    network_mode: "host"
    environment:
      - MODELS_CONFIG=/config/models.yaml
      - PROFILER_DB=/state/profiler.sqlite
    volumes:
      - ./llm:/config:ro   # models.yaml and, when this machine has one, models.local.yaml
      - profiler-state:/state

volumes:
  profiler-state:
